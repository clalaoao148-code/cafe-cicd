name: Deploy static site
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  # Задание 1: проверка разметки
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Check HTML with HTMLHint
        run: npx --yes htmlhint@1.1.4 --rules doctype-first,html-lang-require,title-require,tag-pair,id-unique,attr-no-duplication,alt-require index.html
 
  # Задание 2: публикация (только если lint прошёл)
  deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
